version: "3.8"

services:
  postgres:
    image: postgres:15.6
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - internal-net
    restart: unless-stopped

    # Pemakaian nyata 81 MB. Batasnya longgar supaya query berat tetap muat,
    # tetapi tetap ada — tanpa batas, satu query yang salah dapat menghabiskan
    # RAM mesin dan menjatuhkan Keycloak bersamanya.
    mem_limit: 2g

  keycloak_web:
    build:
      context: ./keycloak
    image: login-ponorogo:26.7.0
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_COOKIE_DOMAIN: .ponorogo.go.id
      KC_COOKIE_SECURE: true

      # Keycloak 26: KC_PROXY (edge) DIHAPUS. Ganti dengan KC_PROXY_HEADERS.
      # Di belakang Cloudflare/reverse-proxy → 'xforwarded'.
      KC_PROXY_HEADERS: xforwarded

      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      # STRICT wajib true: dengan strict=false Keycloak menentukan issuer dari
      # header Host request → issuer "melayang" (http://host:8080 via internal,
      # https://host via Cloudflare). Token diterbitkan lewat CF (iss=https://..)
      # tapi introspect/validasi me-resolve issuer beda → Keycloak balas
      # active:false → portal introspect gagal → auto-logout tepat setelah login
      # passkey. strict=true memaksa semua URL (termasuk issuer) selalu
      # https://${KEYCLOAK_HOSTNAME}, konsisten di semua jalur.
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true

      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: false
      KC_HEALTH_ENABLED: true

      # Keycloak 26: KEYCLOAK_ADMIN/PASSWORD (untuk bootstrap admin awal)
      # di-rename → KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD. Yang lama masih
      # jalan dengan warning; pakai nama baru supaya bersih. Hanya dipakai
      # saat DB kosong (bootstrap pertama) — DB dev sudah punya admin, jadi
      # ini efektif no-op tapi aman untuk fresh start.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # ⚠️ Heap JVM DIBATASI. Tanpa -Xmx, JVM memakai bawaannya sendiri dan
      # di LXC ini memilih MaxHeapSize 43,8 GB — LEBIH BESAR dari RAM mesin
      # (31 GB). Selama beban ringan itu tidak terlihat; begitu beban naik,
      # JVM berhak mengambil sampai OOM-killer bertindak, dan yang dibunuh
      # kernel belum tentu Keycloak.
      #
      # 4 GB dipilih dari pengukuran, bukan tebakan: heap yang BENAR-BENAR
      # dipakai stabil di 2,7 GB (jcmd GC.heap_info, tiga kali sepuluh detik),
      # metaspace 170 MB. 4 GB memberi ruang ~50% di atas itu.
      #
      # RSS container sempat 10,4 GB karena G1 mengalokasikan heap besar lalu
      # tidak pernah mengembalikannya ke sistem. MaxRAMPercentage tidak dipakai
      # supaya angkanya tidak ikut berubah bila RAM LXC diubah.
      JAVA_OPTS_APPEND: "-Xms512m -Xmx4g -XX:MaxMetaspaceSize=512m"
    command: start-dev
    depends_on:
      - postgres
    ports:
      # ⚠️ Hanya localhost. Satu-satunya yang perlu menjangkau Keycloak adalah
      # cloudflared di host yang sama (localhost:8080, lewat IPv4 maupun IPv6).
      # Port yang dipublikasikan Docker MELEWATI UFW, jadi pemetaan tanpa IP
      # (0.0.0.0) membuat API dan konsol admin Keycloak terbuka langsung lewat
      # HTTP polos tanpa Cloudflare, dan header X-Forwarded-Proto dapat
      # dipalsukan (audit keamanan 15 Oktober 2026).
      - 127.0.0.1:${KEYCLOAK_PORT}:${KEYCLOAK_PORT}
      - "[::1]:${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    networks:
      - internal-net
    restart: unless-stopped

    # Pagar terakhir bila heap saja tidak cukup menahan. Diberi ruang di atas
    # -Xmx 4g karena JVM juga memakai memori di luar heap: metaspace, thread
    # stack, buffer langsung, dan kode ter-JIT.
    mem_limit: 6g

volumes:
  postgres_data:

networks:
  internal-net:
    driver: bridge
