version: "3.8"

services:
  postgres:
    image: postgres:15.6
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - internal-net
    restart: unless-stopped

  keycloak_web:
    build:
      context: ./keycloak
    image: login-ponorogo:26.4.3
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_COOKIE_DOMAIN: .ponorogo.go.id
      KC_COOKIE_SECURE: true

      # Keycloak 26: KC_PROXY (edge) DIHAPUS. Ganti dengan KC_PROXY_HEADERS.
      # Di belakang Cloudflare/reverse-proxy → 'xforwarded'.
      KC_PROXY_HEADERS: xforwarded

      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: true

      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true

      # Keycloak 26: KEYCLOAK_ADMIN/PASSWORD (untuk bootstrap admin awal)
      # di-rename → KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD. Yang lama masih
      # jalan dengan warning; pakai nama baru supaya bersih. Hanya dipakai
      # saat DB kosong (bootstrap pertama) — DB dev sudah punya admin, jadi
      # ini efektif no-op tapi aman untuk fresh start.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    depends_on:
      - postgres
    ports:
      - ${KEYCLOAK_PORT}:${KEYCLOAK_PORT}
    networks:
      - internal-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal-net:
    driver: bridge
