<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi email · PRAMANA</title>
<link rel="stylesheet" href="../login/resources/css/styles.css">
</head>
<body class="min-h-screen bg-zinc-100 py-8 px-4 font-sans">
  <div class="mx-auto" style="max-width:390px">
    <div class="overflow-hidden rounded-[28px] bg-white shadow-2xl ring-1 ring-zinc-900/10" style="min-height:780px">
      <div class="flex min-h-full flex-col bg-zinc-50" style="min-height:780px">
        <header class="flex items-center gap-3 border-b border-zinc-100 bg-white px-4 pb-3 pt-12">
          <span class="text-zinc-700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></span>
          <div>
            <h1 class="text-sm font-extrabold text-zinc-900">Verifikasi Email</h1>
            
          </div>
        </header>
        <div class="flex-1 px-4 pt-4">
                  <div class="flex gap-2.5 rounded-xl bg-emerald-50 p-3.5 ring-1 ring-emerald-100">
          <span class="mt-0.5 shrink-0 text-emerald-600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
          <div>
            <p class="text-[11px] font-bold text-emerald-900">Tautan sudah dikirim</p>
            <p class="mt-1 text-[10px] leading-relaxed text-emerald-800">Kami mengirim tautan aktivasi ke <b>sedulur@email.com</b></p>
          </div>
        </div>
          <div class="px-2 pt-8 text-center">
            <div class="mx-auto grid h-20 w-20 place-items-center rounded-3xl bg-marun-50 text-marun-700 ring-1 ring-marun-100">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0z"/><path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"/></svg>
            </div>
            <p class="mt-5 text-[12px] leading-relaxed text-zinc-600">
              Buka email itu lalu tekan tautannya untuk mengaktifkan akun Sedulur.
            </p>
          </div>
          <div class="mt-8">
                    <div class="flex gap-2.5 rounded-xl bg-amber-50 p-3.5 ring-1 ring-amber-100">
          <span class="mt-0.5 shrink-0 text-amber-600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
          <div>
            
            <p class="text-[10px] leading-relaxed text-amber-800">Belum menerima email? Periksa folder <b>spam</b> terlebih dahulu.</p>
          </div>
        </div>
            <div class="mt-4">
              <button class="w-full rounded-xl bg-white py-3.5 text-[13px] font-bold text-marun-700 ring-1 ring-zinc-200">Kirim Ulang Email</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="mt-3 text-center text-[11px] text-zinc-400">Verifikasi email</p>
  </div>
</body>
</html>
