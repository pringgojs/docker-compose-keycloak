<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk dengan email · PRAMANA</title>
<link rel="stylesheet" href="../login/resources/css/styles.css">
</head>
<body class="min-h-screen bg-zinc-100 py-8 px-4 font-sans">
  <div class="mx-auto" style="max-width:390px">
    <div class="overflow-hidden rounded-[28px] bg-white shadow-2xl ring-1 ring-zinc-900/10" style="min-height:780px">
      <div class="flex min-h-full flex-col bg-white" style="min-height:780px">
        <header class="flex items-center gap-3 border-b border-zinc-100 bg-white px-4 pb-3 pt-12">
          <span class="text-zinc-700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></span>
          <div>
            <h1 class="text-sm font-extrabold text-zinc-900">Masuk dengan Email</h1>
            
          </div>
        </header>
        <div class="flex-1 px-4 pt-5">
                  <div class="mb-4">
          <label class="text-[11px] font-bold text-zinc-700">Email <span class="text-rose-600">*</span></label>
          <div class="mt-2 flex items-center gap-2.5 rounded-xl bg-white px-3 py-3 ring-1 ring-zinc-200 focus-within:ring-2 focus-within:ring-marun-500">
            <span class="shrink-0 text-zinc-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <span class="flex-1 text-[13px] text-zinc-800"><span class="text-zinc-300">nama@email.com</span></span>
            
          </div>
          
        </div>
                  <div class="mb-4">
          <label class="text-[11px] font-bold text-zinc-700">Kata Sandi <span class="text-rose-600">*</span></label>
          <div class="mt-2 flex items-center gap-2.5 rounded-xl bg-white px-3 py-3 ring-1 ring-zinc-200 focus-within:ring-2 focus-within:ring-marun-500">
            <span class="shrink-0 text-zinc-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            <span class="flex-1 text-[13px] text-zinc-800"><span class="tracking-widest text-zinc-800">••••••••</span></span>
            <span class="shrink-0 text-zinc-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span>
          </div>
          
        </div>

          <div class="mb-5 flex items-center justify-between">
            <label class="flex items-center gap-2 text-[11px] text-zinc-600">
              <span class="grid h-4 w-4 place-items-center rounded border border-zinc-300 bg-white"></span>
              Ingat saya
            </label>
            <span class="text-[11px] font-bold text-marun-700 underline">Lupa kata sandi?</span>
          </div>

                  <button class="flex w-full items-center justify-center gap-2 rounded-xl bg-marun-700 py-3.5 text-[13px] font-bold text-white shadow-lg shadow-marun-700/20 transition hover:bg-marun-800">Masuk</button>

          <p class="mt-5 text-center text-[11px] text-zinc-500">
            Belum punya akun? <span class="font-bold text-marun-700 underline">Daftar sekarang</span>
          </p>
                  <div class="mt-6 flex gap-2 rounded-xl bg-zinc-50 p-3 ring-1 ring-zinc-200">
          <span class="mt-0.5 shrink-0 text-zinc-500"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <p class="text-[9.5px] leading-relaxed text-zinc-500">
            Data Sedulur dilindungi sesuai <b class="text-zinc-700">UU No. 27 Tahun 2022</b> tentang
            Pelindungan Data Pribadi.
          </p>
        </div>
        </div>
      </div>
    </div>
    <p class="mt-3 text-center text-[11px] text-zinc-400">Masuk dengan email</p>
  </div>
</body>
</html>
