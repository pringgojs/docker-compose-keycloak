<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa kata sandi · PRAMANA</title>
<link rel="stylesheet" href="../login/resources/css/styles.css">
</head>
<body class="min-h-screen font-sans bg-gradient-to-b from-marun-50 to-slate-50 dark:from-[#1a0708] dark:to-neutral-950 text-slate-800 dark:text-neutral-100 flex items-center justify-center py-8 px-4">
  <div class="w-full flex items-center justify-center">
    <div class="w-full max-w-md bg-white dark:bg-neutral-900 rounded-[22px] shadow-[0_20px_50px_-20px_rgba(122,31,31,.4)] ring-1 ring-slate-100 dark:ring-white/10 overflow-hidden">

    <div class="hero-pattern relative px-6 pt-7 pb-9 text-center text-white bg-gradient-to-br from-marun-900 via-marun-800 to-marun-700 overflow-hidden">
      <div class="kipas-merak"></div>
      <div class="relative">
        <div class="mx-auto mb-3 grid place-items-center w-14 h-14 rounded-2xl bg-white/12 ring-1 ring-white/20 backdrop-blur">
          <svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 5 27 15 37 12 31 20 40 25 30 27 33 37 24 31 15 37 18 27 8 25 17 20 11 12 21 15Z" fill="#F5C518" opacity=".92"/>
            <circle cx="24" cy="25" r="5.5" fill="#7A1F1F" stroke="#F5C518" stroke-width="1.6"/>
          </svg>
        </div>
        <h1 class="text-[22px] font-extrabold tracking-tight">Lupa Kata Sandi</h1>
        <p class="mt-1 text-[12px] text-white/75 leading-relaxed">Kami bantu Sedulur masuk kembali</p>
      </div>
    </div>
      <div class="px-6 pt-6">
        
        <div class="flex items-start gap-2.5 rounded-xl border-[1.5px] p-3 mb-4 text-xs leading-relaxed border-sky-200 dark:border-sky-500/30 bg-sky-50 dark:bg-sky-500/10 text-sky-700 dark:text-sky-300">
          <span class="shrink-0 mt-px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span><span>Masukkan email yang Sedulur pakai saat mendaftar. Kami kirimkan tautan untuk membuat kata sandi baru.</span>
        </div>
        <form>
          
        <div class="mb-4">
          <label class="block text-[13px] font-semibold text-slate-700 dark:text-neutral-300 mb-1.5">Email</label>
          <div class="field-wrap relative">
            <span class="field-ikon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input type="email" placeholder="nama@email.com" value=""
              class="w-full py-3 pl-[42px] pr-3.5 text-sm rounded-xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 text-slate-800 dark:text-neutral-100 placeholder-slate-300 dark:placeholder-neutral-600 focus:outline-none focus:border-marun-700 focus:bg-white dark:focus:bg-neutral-900 focus:ring-4 focus:ring-marun-700/10 transition">
            
          </div>
          
        </div>
          
        <button type="submit" class="btn-sapu w-full inline-flex items-center justify-center gap-2 py-3 rounded-[13px] text-[15px] font-extrabold text-white bg-gradient-to-r from-marun-800 via-marun-700 to-marun-600 shadow-lg shadow-marun-700/25 hover:-translate-y-0.5 transition cursor-pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> Kirim Tautan
        </button>
        </form>
        <p class="text-center mt-5">
          <a href="login.html" class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-slate-500 dark:text-neutral-400 no-underline hover:text-marun-700">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Kembali ke halaman masuk
          </a>
        </p>
      </div>

  <div class="px-6 pb-6 pt-1">
    <p class="text-[11px] text-slate-400 dark:text-neutral-500 text-center leading-relaxed">
      Layanan resmi <span class="font-semibold text-slate-500 dark:text-neutral-400">Pemerintah Kabupaten Ponorogo</span>
    </p>
  </div>
    </div>
  </div>
</body>
</html>
