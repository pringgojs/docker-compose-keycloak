# =============================================================================
# Pesan Bahasa Indonesia — theme pramana-citizen (realm warga)
# -----------------------------------------------------------------------------
# docs/14 bagian 7 menyebut DUA hal yang paling sering terlewat pada penyesuaian
# halaman masuk: tampilan bawaan Keycloak, dan pesan galat yang masih berbahasa
# Inggris. Berkas ini menangani yang kedua.
#
# Nada: hangat dan lugas, menyapa "Sedulur" — sejalan dengan nada aplikasi
# (12-design-system 2.3). Setiap pesan galat menjelaskan JALAN KELUAR, bukan
# sekadar menyatakan ada yang salah.
#
# Keycloak memuat berkas ini karena theme.properties mendaftarkan locales=id,en.
# Kunci yang tidak ditimpa di sini jatuh ke bawaan Keycloak.
# =============================================================================

# ----- Judul & sapaan -----
loginAccountTitle=Masuk ke Akun Sedulur
registerTitle=Daftar Akun
emailForgotTitle=Lupa Kata Sandi
updatePasswordTitle=Buat Kata Sandi Baru
emailVerifyTitle=Periksa Email Sedulur

# ----- Label kolom -----
usernameOrEmail=Email
email=Email
password=Kata Sandi
passwordConfirm=Ulangi Kata Sandi
firstName=Nama Depan
lastName=Nama Belakang
rememberMe=Ingat saya

# ----- Tombol -----
doLogIn=Masuk
doRegister=Daftar
doSubmit=Kirim
doCancel=Batal
doForgotPassword=Lupa kata sandi?
doClickHere=tekan di sini
doTryAgain=Coba Lagi
