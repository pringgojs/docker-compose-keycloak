# ----- Ajakan -----
noAccount=Belum punya akun?
alreadyHaveAccount=Sudah punya akun?

# =============================================================================
# PESAN GALAT
# Bawaan Keycloak berbahasa Inggris dan berbunyi teknis. Ditulis ulang agar
# warga tahu APA yang harus dilakukan. Contoh perbandingan ada di docs/14 §7.
# =============================================================================

# "Invalid username or password."
invalidUserMessage=Email atau kata sandi yang Sedulur masukkan tidak cocok. Coba periksa kembali.
# "Invalid username or password."
invalidPasswordMessage=Kata sandi yang Sedulur masukkan tidak cocok. Coba periksa kembali.
# "Account is temporarily locked."
accountTemporarilyDisabledMessage=Terlalu banyak percobaan masuk. Mohon tunggu beberapa saat, lalu coba lagi.
# "An error occurred, please login again."
expiredCodeMessage=Sesi Sedulur sudah berakhir. Silakan masuk kembali.
pageExpiredMsg=Halaman ini sudah kedaluwarsa karena terlalu lama menunggu.
expiredActionMessage=Permintaan ini sudah kedaluwarsa. Silakan mulai kembali.

# Kolom kosong / tidak valid
missingUsernameMessage=Mohon isi email Sedulur.
missingPasswordMessage=Mohon isi kata sandi Sedulur.
missingEmailMessage=Mohon isi email Sedulur.
missingFirstNameMessage=Mohon isi nama depan Sedulur.
missingLastNameMessage=Mohon isi nama belakang Sedulur.
invalidEmailMessage=Alamat email ini sepertinya keliru. Contoh yang benar: nama@email.com
notMatchPasswordMessage=Kedua kata sandi belum sama. Mohon ketik ulang.
invalidPasswordMinLengthMessage=Kata sandi minimal {0} huruf.
emailExistsMessage=Email ini sudah terdaftar. Silakan masuk, atau pakai email lain.
usernameExistsMessage=Akun dengan email ini sudah ada. Silakan masuk.

# Verifikasi email
emailVerifyInstruction1=Kami sudah mengirim tautan ke {0}.
emailVerifyInstruction2=Belum menerima email? Periksa folder spam terlebih dahulu.
emailVerifyInstruction3=Bila masih belum ada,
emailInstruction=Masukkan email yang Sedulur pakai saat mendaftar. Kami kirimkan tautan untuk membuat kata sandi baru.
emailSentMessage=Tautan sudah kami kirim. Mohon periksa email Sedulur.
emailSendErrorMessage=Email gagal terkirim. Mohon coba beberapa saat lagi.

# Galat umum
internalServerErrorMessage=Kami tidak dapat memproses permintaan Sedulur saat ini. Silakan coba beberapa saat lagi.
unexpectedErrorMessage=Ada yang tidak beres. Silakan coba kembali.
identityProviderUnexpectedErrorMessage=Gagal masuk dengan layanan tersebut. Silakan coba cara lain.

