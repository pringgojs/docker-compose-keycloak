# =============================================================================
# Theme: pramana-citizen — halaman masuk & daftar WARGA
# Realm: ponorogo-citizen · Keycloak 26.7
# -----------------------------------------------------------------------------
# TERPISAH dari asn-v2 (pegawai). Keduanya berbagi image yang sama, jadi
# JANGAN menyunting asn-v2 dari sini — kekeliruan di situ merusak login ASN
# produksi.
#
# parent=keycloak supaya SEMUA base form page (login-reset-password,
# login-update-password, select-authenticator, webauthn-*, terms, page-expired,
# verify-email, register, dst.) ikut ter-render lewat styling ini TANPA harus
# menulis ulang tiap page.
#
# STRATEGI STYLING (mengikuti pola asn-v2 & agustusan-2026 yang sudah terbukti):
# nilai tiap properti kc*Class = rangkaian utility Tailwind, BUKAN nama class
# CSS kustom. tailwind.config.js memindai berkas ini, jadi utility di sini ikut
# ter-compile ke resources/css/styles.css. Komponen yang tidak praktis jadi
# utility (pola hero, kipas merak, ikon dalam field, ikon mask) ada di
# resources/css/input.css pada @layer components.
#
# Dark mode = "media" (ikut preferensi sistem, TANPA tombol toggle) — warga
# tidak akan mencari tombol tema di halaman login. Karena itu setiap warna di
# bawah punya pasangan varian dark:.
#
# Palet: marun #7A1F1F/#A32C2C · emas #F5C518 (docs/teknis/12-design-system.md).
# Emas dipakai HEMAT — satu titik aksen per layar, sesuai peringatan di 1.2.
#
# Dipasang ke realm: loginTheme=pramana-citizen pada realm ponorogo-citizen.
# =============================================================================

parent=keycloak
import=common/keycloak

# CSS hasil build Tailwind. Build:
#   npm run build:pramana
styles=css/styles.css

locales=id,en

# =============================================================================
# CATATAN IKON — tanpa FontAwesome, tanpa emoji
# -----------------------------------------------------------------------------
# Halaman yang kita override memakai SVG Lucide inline. Namun sebagian properti
# di bawah bernilai NAMA CLASS IKON dan dirender oleh template BASE Keycloak
# yang TIDAK kita override (select-authenticator.ftl, webauthn-*.ftl, dst).
# Base merender <i class="${properties.kcXxxIcon!}"></i> — SVG tidak bisa
# disisipkan di situ tanpa menulis ulang page-nya.
#
# KEPUTUSAN: properti semacam itu diisi class mask kita sendiri
# (.ikon-mask .ikon-*), yang menggambar SVG Lucide lewat CSS mask-image
# data-URI di input.css. Ikon tetap tampil, mewarisi currentColor, dan tidak
# ada satu pun referensi FontAwesome yang tersisa.
#
# Emoji dilarang: dirender OS, sehingga tampil berbeda di tiap merek ponsel
# (12-design-system bagian 4).
# =============================================================================

# ----- Kerangka halaman -----
kcHtmlClass=h-full
kcBodyClass=min-h-screen font-sans bg-gradient-to-b from-marun-50 to-slate-50 dark:from-[#1a0708] dark:to-neutral-950 text-slate-800 dark:text-neutral-100 flex items-center justify-center py-8 px-4

kcLoginClass=w-full flex items-center justify-center

# Kartu utama — radius 22px, ring tipis, bayangan marun lembut
kcFormCardClass=w-full max-w-md bg-white dark:bg-neutral-900 rounded-[22px] shadow-[0_20px_50px_-20px_rgba(122,31,31,.4)] ring-1 ring-slate-100 dark:ring-white/10 overflow-hidden

# Hero marun bergradien + pola bintik (.hero-pattern dari input.css)
kcFormHeaderClass=hero-pattern relative px-6 pt-7 pb-9 text-center text-white bg-gradient-to-br from-marun-900 via-marun-800 to-marun-700 overflow-hidden

# Header realm bawaan disembunyikan — branding sudah ada di hero kita
kcHeaderClass=hidden
kcHeaderWrapperClass=hidden

kcContentWrapperClass=px-6 pt-6
kcFormClass=
kcFormGroupClass=mb-4
kcFormGroupErrorClass=has-error
kcFormSettingClass=
kcFormOptionsClass=flex items-center justify-between mb-4
kcFormOptionsWrapperClass=
kcFormButtonsClass=
kcFormButtonsWrapperClass=

# ----- Label & input -----
kcLabelWrapperClass=
kcLabelClass=block text-[13px] font-semibold text-slate-700 dark:text-neutral-300 mb-1.5
kcInputWrapperClass=
kcInputGroup=field-wrap relative mb-4
kcInputClass=w-full py-3 px-3.5 text-sm rounded-xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 text-slate-800 dark:text-neutral-100 placeholder-slate-300 dark:placeholder-neutral-600 focus:outline-none focus:border-marun-700 focus:bg-white dark:focus:bg-neutral-900 focus:ring-4 focus:ring-marun-700/10 transition
kcInputErrorMessageClass=block mt-1.5 mb-2 text-[11px] font-semibold text-rose-600 dark:text-rose-400
kcTextareaClass=w-full py-3 px-3.5 text-sm rounded-xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 text-slate-800 dark:text-neutral-100 focus:outline-none focus:border-marun-700 focus:ring-4 focus:ring-marun-700/10 transition

# ----- Tombol -----
kcButtonClass=inline-flex items-center justify-center gap-2 py-3 rounded-[13px] font-bold no-underline cursor-pointer transition
kcButtonPrimaryClass=btn-sapu text-[15px] font-extrabold text-white bg-gradient-to-r from-marun-800 via-marun-700 to-marun-600 shadow-lg shadow-marun-700/25 hover:-translate-y-0.5
kcButtonDefaultClass=text-sm font-semibold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-300 hover:border-marun-700 hover:text-marun-700
kcButtonSecondaryClass=text-sm font-semibold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-300 hover:border-marun-700 hover:text-marun-700
kcButtonBlockClass=w-full
kcButtonLargeClass=
kcMarginTopClass=mt-2.5

# ----- Tombol tampil/sembunyi kata sandi -----
kcFormPasswordVisibilityButtonClass=absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-neutral-500 hover:text-marun-700 transition
kcFormPasswordVisibilityIconShow=ikon-mask ikon-mata
kcFormPasswordVisibilityIconHide=ikon-mask ikon-mata-coret

# ----- Alert -----
kcAlertClass=flex items-start gap-2.5 rounded-xl border-[1.5px] p-3 mb-4 text-xs leading-relaxed
kcAlertTitleClass=
kcFeedbackSuccessIcon=ikon-mask ikon-sukses
kcFeedbackWarningIcon=ikon-mask ikon-peringatan
kcFeedbackErrorIcon=ikon-mask ikon-galat
kcFeedbackInfoIcon=ikon-mask ikon-info
kcResetFlowIcon=ikon-mask ikon-muter

# ----- Info / sign-up -----
kcSignUpClass=text-[12px] text-slate-500 dark:text-neutral-400 text-center mt-5
kcInfoAreaWrapperClass=

# ----- Select authenticator (base page — tidak di-override) -----
kcSelectAuthListClass=
kcSelectAuthListItemClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 hover:border-marun-700 hover:bg-white dark:hover:bg-neutral-900 transition cursor-pointer text-left
kcSelectAuthListItemIconClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-marun-50 dark:bg-marun-900/30 text-marun-700 dark:text-marun-400
kcSelectAuthListItemIconPropertyClass=text-xl
kcSelectAuthListItemBodyClass=flex-1 min-w-0
kcSelectAuthListItemHeadingClass=block text-sm font-semibold text-slate-800 dark:text-neutral-100
kcSelectAuthListItemDescriptionClass=block text-[11px] text-slate-400 dark:text-neutral-500
kcSelectAuthListItemFillClass=flex-1
kcSelectAuthListItemArrowClass=shrink-0 text-slate-300 dark:text-neutral-600
kcSelectAuthListItemArrowIconClass=ikon-mask ikon-panah-kanan text-lg

# Ikon per jenis authenticator (dibaca base lewat properties[iconCssClass])
kcAuthenticatorPasswordClass=ikon-mask ikon-kunci text-xl
kcAuthenticatorWebAuthnClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorWebAuthnPasswordlessClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorOTPClass=ikon-mask ikon-ponsel text-xl
kcAuthenticatorRecoveryAuthnCodeClass=ikon-mask ikon-daftar-centang text-xl

# ----- WebAuthn / passkey -----
kcWebAuthnKeyIcon=ikon-mask ikon-sidik-jari text-xl
# Sengaja dikosongkan: hiasan kecil di daftar perangkat terdaftar, tidak esensial.
kcWebAuthnDefaultIcon=

kcCommonLogoIdP=

# ----- Identity provider (Google) -----
kcFormSocialAccountSectionClass=mt-4
kcFormSocialAccountListClass=space-y-2.5
kcFormSocialAccountListGridClass=grid grid-cols-2 gap-2.5
kcFormSocialAccountListButtonClass=w-full inline-flex items-center justify-center gap-2.5 py-3 rounded-[13px] text-sm font-bold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-700 dark:text-neutral-200 hover:border-marun-700 hover:text-marun-700 dark:hover:text-marun-400 transition no-underline
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=truncate

# ----- Daftar kredensial OTP -----
kcLoginOTPListClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 hover:border-marun-700 hover:bg-white dark:hover:bg-neutral-900 transition cursor-pointer text-left
kcLoginOTPListInputClass=w-[15px] h-[15px] accent-marun-700 shrink-0
kcLoginOTPListItemHeaderClass=flex items-center gap-3.5
kcLoginOTPListItemIconBodyClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-marun-50 dark:bg-marun-900/30 text-marun-700
kcLoginOTPListItemIconClass=ikon-mask ikon-ponsel text-xl
kcLoginOTPListItemTitleClass=block text-sm font-semibold text-slate-800 dark:text-neutral-100

# ----- Pemilih bahasa -----
kcLocaleMainClass=absolute top-2.5 right-3 z-20 text-[11px]
kcLocaleWrapperClass=relative
kcLocaleDropDownClass=relative inline-block
kcLocaleListClass=absolute right-0 mt-1 py-1 bg-white dark:bg-neutral-900 border border-slate-200 dark:border-neutral-700 rounded-xl shadow-lg z-30 hidden
kcLocaleListItemClass=block
kcLocaleItemClass=block px-3.5 py-1.5 text-xs text-slate-600 dark:text-neutral-300 hover:bg-slate-100 dark:hover:bg-neutral-800 no-underline
