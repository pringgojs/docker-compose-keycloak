# =============================================================================
# Theme: pramana-citizen — halaman masuk & daftar WARGA
# Realm: ponorogo-citizen · Keycloak 26.7
# -----------------------------------------------------------------------------
# TERPISAH dari asn-v2 (pegawai). Keduanya berbagi image yang sama, jadi
# JANGAN menyunting asn-v2 dari sini — kekeliruan di situ merusak login ASN
# produksi.
#
# parent=keycloak supaya SEMUA base form page (login-reset-password,
# login-update-password, select-authenticator, webauthn-*, terms, page-expired,
# verify-email, register, dst.) ikut ter-render lewat styling ini TANPA harus
# menulis ulang tiap page.
#
# STRATEGI STYLING (mengikuti pola asn-v2 & agustusan-2026 yang sudah terbukti):
# nilai tiap properti kc*Class = rangkaian utility Tailwind, BUKAN nama class
# CSS kustom. tailwind.config.js memindai berkas ini, jadi utility di sini ikut
# ter-compile ke resources/css/styles.css. Komponen yang tidak praktis jadi
# utility (pola hero, ikon dalam field, ikon mask) ada di
# resources/css/input.css pada @layer components.
#
# ACUAN DESAIN: ponorogo-super-apps/mockup/src/screens/*.jsx — bukan tafsir
# bebas atas design system. TANPA dark mode: mockup PRAMANA hanya punya mode
# terang, dan layar masuk sudah berlatar marun gelap dengan sendirinya.
#
# Palet: marun #7A1F1F/#A32C2C · emas #F5C518 (docs/teknis/12-design-system.md).
# Emas dipakai HEMAT — satu titik aksen per layar, sesuai peringatan di 1.2.
#
# Dipasang ke realm: loginTheme=pramana-citizen pada realm ponorogo-citizen.
# =============================================================================

parent=keycloak
import=common/keycloak

# CSS hasil build Tailwind. Build:
#   npm run build:pramana
styles=css/styles.css

locales=id,en

# =============================================================================
# CATATAN IKON — tanpa FontAwesome, tanpa emoji
# -----------------------------------------------------------------------------
# Halaman yang kita override memakai SVG Lucide inline. Namun sebagian properti
# di bawah bernilai NAMA CLASS IKON dan dirender oleh template BASE Keycloak
# yang TIDAK kita override (select-authenticator.ftl, webauthn-*.ftl, dst).
# Base merender <i class="${properties.kcXxxIcon!}"></i> — SVG tidak bisa
# disisipkan di situ tanpa menulis ulang page-nya.
#
# KEPUTUSAN: properti semacam itu diisi class mask kita sendiri
# (.ikon-mask .ikon-*), yang menggambar SVG Lucide lewat CSS mask-image
# data-URI di input.css. Ikon tetap tampil, mewarisi currentColor, dan tidak
# ada satu pun referensi FontAwesome yang tersisa.
#
# Emoji dilarang: dirender OS, sehingga tampil berbeda di tiap merek ponsel
# (12-design-system bagian 4).
# =============================================================================

# ----- Kerangka halaman -----
kcHtmlClass=h-full
kcBodyClass=min-h-screen font-sans bg-zinc-50 text-zinc-800

kcLoginClass=mx-auto flex min-h-screen w-full max-w-[430px] flex-col

# Wadah layar — penuh, bukan kartu melayang (mockup memakai layar penuh)
kcFormCardClass=flex min-h-screen w-full flex-col bg-zinc-50

# Header ramping ala mockup: garis bawah tipis, latar putih
kcFormHeaderClass=border-b border-zinc-100 bg-white px-4 pb-3 pt-12

# Judul halaman di header
kcHeaderClass=text-sm font-extrabold text-zinc-900
kcHeaderWrapperClass=

kcContentWrapperClass=flex-1 px-4 pt-4
kcFormClass=
kcFormGroupClass=mb-4
kcFormGroupErrorClass=has-error
kcFormSettingClass=
kcFormOptionsClass=flex items-center justify-between mb-4
kcFormOptionsWrapperClass=
kcFormButtonsClass=
kcFormButtonsWrapperClass=

# ----- Label & input -----
kcLabelWrapperClass=mb-2 flex items-center gap-1
kcLabelClass=text-[11px] font-bold text-zinc-700
kcInputWrapperClass=
kcInputGroup=field-wrap relative
kcInputClass=w-full rounded-xl bg-white px-3 py-3 text-[13px] text-zinc-800 ring-1 ring-zinc-200 placeholder-zinc-300 focus:outline-none focus:ring-2 focus:ring-marun-500 transition
kcInputErrorMessageClass=block mt-1.5 mb-2 text-[10px] font-bold text-rose-600
kcTextareaClass=w-full rounded-xl bg-white px-3 py-3 text-[13px] text-zinc-800 ring-1 ring-zinc-200 focus:outline-none focus:ring-2 focus:ring-marun-500 transition

# ----- Tombol -----
kcButtonClass=inline-flex items-center justify-center gap-2 rounded-xl py-3.5 text-[13px] font-bold no-underline cursor-pointer transition
kcButtonPrimaryClass=bg-marun-700 text-white shadow-lg shadow-marun-700/20 hover:bg-marun-800
kcButtonDefaultClass=bg-white text-marun-700 ring-1 ring-zinc-200 hover:ring-marun-600
kcButtonSecondaryClass=bg-white text-marun-700 ring-1 ring-zinc-200 hover:ring-marun-600
kcButtonBlockClass=w-full
kcButtonLargeClass=
kcMarginTopClass=mt-2.5

# ----- Tombol tampil/sembunyi kata sandi -----
kcFormPasswordVisibilityButtonClass=absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-marun-700 transition
kcFormPasswordVisibilityIconShow=ikon-mask ikon-mata
kcFormPasswordVisibilityIconHide=ikon-mask ikon-mata-coret

# ----- Alert -----
kcAlertClass=flex items-start gap-2.5 rounded-xl border-[1.5px] p-3 mb-4 text-xs leading-relaxed
kcAlertTitleClass=
kcFeedbackSuccessIcon=ikon-mask ikon-sukses
kcFeedbackWarningIcon=ikon-mask ikon-peringatan
kcFeedbackErrorIcon=ikon-mask ikon-galat
kcFeedbackInfoIcon=ikon-mask ikon-info
kcResetFlowIcon=ikon-mask ikon-muter

# ----- Info / sign-up -----
kcSignUpClass=text-[12px] text-zinc-500 text-center mt-5
kcInfoAreaWrapperClass=

# ----- Select authenticator (base page — tidak di-override) -----
kcSelectAuthListClass=
kcSelectAuthListItemClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl ring-1 ring-zinc-200 bg-white hover:border-marun-700 hover:bg-white transition cursor-pointer text-left
kcSelectAuthListItemIconClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-marun-50 text-marun-700
kcSelectAuthListItemIconPropertyClass=text-xl
kcSelectAuthListItemBodyClass=flex-1 min-w-0
kcSelectAuthListItemHeadingClass=block text-sm font-semibold text-zinc-800
kcSelectAuthListItemDescriptionClass=block text-[11px] text-zinc-400
kcSelectAuthListItemFillClass=flex-1
kcSelectAuthListItemArrowClass=shrink-0 text-zinc-300
kcSelectAuthListItemArrowIconClass=ikon-mask ikon-panah-kanan text-lg

# Ikon per jenis authenticator (dibaca base lewat properties[iconCssClass])
kcAuthenticatorPasswordClass=ikon-mask ikon-kunci text-xl
kcAuthenticatorWebAuthnClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorWebAuthnPasswordlessClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorOTPClass=ikon-mask ikon-ponsel text-xl
kcAuthenticatorRecoveryAuthnCodeClass=ikon-mask ikon-daftar-centang text-xl

# ----- WebAuthn / passkey -----
kcWebAuthnKeyIcon=ikon-mask ikon-sidik-jari text-xl
# Sengaja dikosongkan: hiasan kecil di daftar perangkat terdaftar, tidak esensial.
kcWebAuthnDefaultIcon=

kcCommonLogoIdP=

# ----- Identity provider (Google) -----
kcFormSocialAccountSectionClass=mt-4
kcFormSocialAccountListClass=space-y-2.5
kcFormSocialAccountListGridClass=grid grid-cols-2 gap-2.5
kcFormSocialAccountListButtonClass=w-full inline-flex items-center justify-center gap-2.5 py-3 rounded-[13px] text-sm font-bold ring-1 ring-zinc-200 text-zinc-700 hover:border-marun-700 hover:text-marun-700 transition no-underline
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=truncate

# ----- Daftar kredensial OTP -----
kcLoginOTPListClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl ring-1 ring-zinc-200 bg-white hover:border-marun-700 hover:bg-white transition cursor-pointer text-left
kcLoginOTPListInputClass=w-[15px] h-[15px] accent-marun-700 shrink-0
kcLoginOTPListItemHeaderClass=flex items-center gap-3.5
kcLoginOTPListItemIconBodyClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-marun-50 text-marun-700
kcLoginOTPListItemIconClass=ikon-mask ikon-ponsel text-xl
kcLoginOTPListItemTitleClass=block text-sm font-semibold text-zinc-800

# ----- Pemilih bahasa -----
kcLocaleMainClass=absolute top-2.5 right-3 z-20 text-[11px]
kcLocaleWrapperClass=relative
kcLocaleDropDownClass=relative inline-block
kcLocaleListClass=absolute right-0 mt-1 py-1 bg-white border ring-zinc-200 rounded-xl shadow-lg z-30 hidden
kcLocaleListItemClass=block
kcLocaleItemClass=block px-3.5 py-1.5 text-xs text-zinc-600 hover:bg-zinc-100 no-underline
