# =============================================================================
# Theme: agustusan-2026 — HUT RI ke-81 · Kisara SSO · Kabupaten Ponorogo
# Keycloak 26.7
# -----------------------------------------------------------------------------
# Theme EVENT kemerdekaan (dipakai selama periode Agustus, lalu balik ke asn-v2).
# parent=keycloak supaya SEMUA base form page (login-reset-password,
# login-update-password, select-authenticator, recovery-codes, terms,
# page-expired, verify-email, dst.) ikut ke-render lewat template.ftl custom
# TANPA harus menulis ulang tiap page.
#
# STRATEGI STYLING (mengikuti pola asn-v2 yang sudah terbukti):
# nilai tiap properti kc*Class = rangkaian utility Tailwind, BUKAN nama class
# CSS kustom. tailwind.config.js memindai file ini, jadi utility di sini ikut
# ter-compile ke resources/css/styles.css. Komponen yang tidak praktis jadi
# utility (kembang api, umbul-umbul, pola hero, ikon mask) ada di
# resources/css/input.css pada @layer components.
#
# Dark mode = "media" (ikut preferensi sistem operasi, TANPA tombol toggle).
# Karena itu setiap warna di bawah ini punya pasangan varian dark:.
#
# Palet: merah #c8102e · merah-tua #9e0b23 · merah-muda #e5405a
#        (token di tailwind.config.js).
#
# Toggle theme: set realm loginTheme=agustusan-2026 saat 17-an, balik asn-v2
# sesudahnya.
# =============================================================================

parent=keycloak
import=common/keycloak

# CSS hasil build Tailwind. Build:
#   npx tailwindcss -c themes/agustusan-2026/tailwind.config.js \
#     -i themes/agustusan-2026/login/resources/css/input.css \
#     -o themes/agustusan-2026/login/resources/css/styles.css --minify
styles=css/styles.css

locales=id,en

# =============================================================================
# CATATAN IKON — kenapa tidak ada FontAwesome lagi
# -----------------------------------------------------------------------------
# Theme ini TIDAK memuat FontAwesome. Semua ikon pada halaman yang kita override
# (login, login-otp, login-config-totp, error, info, logout-confirm, template)
# ditulis sebagai SVG Lucide inline langsung di .ftl — identik dengan objek ICON
# di preview/build-preview.js.
#
# Namun sebagian properti di bawah bernilai NAMA CLASS IKON dan dirender oleh
# template BASE Keycloak yang TIDAK kita override (mis. select-authenticator.ftl,
# login-reset-otp.ftl, login-recovery-authn-code-*.ftl). Base merender
# <i class="${properties.kcXxxIcon!}"></i> — kita tidak bisa menyisipkan SVG di
# situ tanpa menulis ulang page-nya.
#
# KEPUTUSAN: properti semacam itu diisi class mask kita sendiri
# (.ikon-mask .ikon-*), yang menggambar SVG Lucide lewat CSS mask-image data-URI
# di input.css. Hasilnya ikon tetap tampil, mewarisi currentColor, dan TIDAK ada
# satu pun referensi FontAwesome yang tersisa. Ikon yang benar-benar tidak
# esensial (kcWebAuthnDefaultIcon, kcCommonLogoIdP) sengaja dikosongkan.
# =============================================================================

# ----- Kerangka halaman -----
kcHtmlClass=h-full
# Latar halaman = gradien rose→slate (terang) / #1a0508→neutral-950 (gelap),
# persis seperti <body> di preview.
kcBodyClass=min-h-screen bg-gradient-to-b from-rose-50 to-slate-50 dark:from-[#1a0508] dark:to-neutral-950 text-slate-800 dark:text-neutral-100 flex items-center justify-center py-8 px-4

# Wrapper terluar (#kc-login)
kcLoginClass=w-full flex items-center justify-center

# Kartu utama — radius 22px + ring tipis + bayangan merah lembut
kcFormCardClass=w-full max-w-md bg-white dark:bg-neutral-900 rounded-[22px] shadow-[0_20px_50px_-20px_rgba(158,11,35,.35)] ring-1 ring-slate-100 dark:ring-white/10 overflow-hidden

# Hero merah bergradien + pola bintik (.hero-pattern dari input.css)
kcFormHeaderClass=hero-pattern relative px-6 pt-6 pb-9 text-center text-white bg-gradient-to-br from-merah-tua via-merah to-merah-muda overflow-hidden

# Header realm bawaan disembunyikan — branding sudah ada di hero kita
kcHeaderClass=hidden
kcHeaderWrapperClass=hidden

kcContentWrapperClass=
kcFormClass=
kcFormGroupClass=mb-4
kcFormGroupErrorClass=has-error
kcFormSettingClass=
kcFormOptionsClass=flex items-center justify-between mb-4
kcFormOptionsWrapperClass=
kcFormButtonsClass=
kcFormButtonsWrapperClass=

# ----- Label & input -----
kcLabelWrapperClass=
kcLabelClass=block text-[13px] font-semibold text-slate-700 dark:text-neutral-300 mb-1.5
kcInputWrapperClass=
# Pembungkus input bericon kiri (.field-wrap di input.css mewarnai .field-ikon
# saat focus-within).
kcInputGroup=field-wrap relative mb-4
# Input TANPA ikon kiri (dipakai base page yang tidak kita override) — padding
# kiri normal. Page yang kita tulis sendiri menambahkan pl-[42px] sendiri.
kcInputClass=w-full py-3 px-3.5 text-sm rounded-xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 text-slate-800 dark:text-neutral-100 placeholder-slate-300 dark:placeholder-neutral-600 focus:outline-none focus:border-merah focus:bg-white dark:focus:bg-neutral-900 focus:ring-4 focus:ring-merah/10 transition
kcInputErrorMessageClass=block mt-1.5 mb-2 text-[11px] font-semibold text-rose-600 dark:text-rose-400
kcTextareaClass=w-full py-3 px-3.5 text-sm rounded-xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 text-slate-800 dark:text-neutral-100 focus:outline-none focus:border-merah focus:ring-4 focus:ring-merah/10 transition

# ----- Tombol -----
# Primary = gradien merah + efek sapu berkilau (.btn-sapu di input.css).
kcButtonClass=inline-flex items-center justify-center gap-2 py-3 rounded-[13px] font-bold no-underline cursor-pointer transition
kcButtonPrimaryClass=btn-sapu text-[15px] text-white bg-gradient-to-r from-merah-tua via-merah to-merah-muda shadow-lg shadow-merah/30 hover:-translate-y-0.5
kcButtonDefaultClass=text-sm font-semibold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-300 hover:border-merah hover:text-merah
# Secondary dipakai tombol passkey (#authenticateWebAuthnButton) dari macro base
# passkeys.ftl. Di halaman login, .aksi-masuk di login.ftl memaksanya jadi kotak
# ikon 52px (lihat input.css). Di page LAIN yang memakai kcButtonSecondaryClass,
# tampilannya tetap tombol outline normal.
kcButtonSecondaryClass=text-sm font-semibold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-300 hover:border-merah hover:text-merah
kcButtonBlockClass=w-full
kcButtonLargeClass=
kcMarginTopClass=mt-2.5

# ----- Tombol tampil/sembunyi kata sandi -----
kcFormPasswordVisibilityButtonClass=absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-neutral-500 hover:text-merah transition
# Nilai di bawah ditukar oleh resources/js/passwordVisibility.js pada elemen <i>.
# Keduanya class mask kita sendiri (ikon Lucide eye / eye-off), BUKAN FontAwesome.
kcFormPasswordVisibilityIconShow=ikon-mata
kcFormPasswordVisibilityIconHide=ikon-mata-coret

# ----- Alert (pesan sukses / peringatan / galat / info) -----
# Warna spesifik per tipe ditambahkan di template.ftl (base tidak menyediakan
# properti terpisah per tipe).
kcAlertClass=flex items-start gap-2.5 rounded-xl border-[1.5px] p-3 mb-4 text-xs leading-relaxed
kcAlertTitleClass=

# Ikon feedback — dirender base sebagai <i class="...">; pakai mask (lihat
# CATATAN IKON di atas). Ukuran 1em mengikuti font-size induknya.
kcFeedbackSuccessIcon=ikon-mask ikon-sukses
kcFeedbackWarningIcon=ikon-mask ikon-peringatan
kcFeedbackErrorIcon=ikon-mask ikon-galat
kcFeedbackInfoIcon=ikon-mask ikon-info

# Ikon "mulai ulang login" di samping username (mode show-username)
kcResetFlowIcon=ikon-mask ikon-muter

# ----- Info / sign-up -----
kcSignUpClass=text-[11px] text-slate-400 dark:text-neutral-500 text-center mt-3.5 leading-relaxed
kcInfoAreaWrapperClass=

# ----- Daftar kredensial OTP (login-otp / login-reset-otp) -----
kcLoginOTPListClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 hover:border-merah hover:bg-white dark:hover:bg-neutral-900 transition cursor-pointer text-left
kcLoginOTPListInputClass=w-[15px] h-[15px] accent-merah shrink-0
kcLoginOTPListItemHeaderClass=flex items-center gap-3.5
kcLoginOTPListItemIconBodyClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-500/15 text-merah
kcLoginOTPListItemIconClass=ikon-mask ikon-ponsel text-xl
kcLoginOTPListItemTitleClass=block text-sm font-semibold text-slate-800 dark:text-neutral-100

# ----- Select authenticator (select-authenticator.ftl — base, tidak di-override) -----
kcSelectAuthListClass=
kcSelectAuthListItemClass=w-full flex items-center gap-3.5 p-3.5 mb-2.5 rounded-2xl border-[1.5px] border-slate-200 dark:border-neutral-700 bg-slate-50 dark:bg-neutral-950 hover:border-merah hover:bg-white dark:hover:bg-neutral-900 transition cursor-pointer text-left
kcSelectAuthListItemIconClass=shrink-0 grid place-items-center w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-500/15 text-merah
kcSelectAuthListItemIconPropertyClass=text-xl
kcSelectAuthListItemBodyClass=flex-1 min-w-0
kcSelectAuthListItemHeadingClass=block text-sm font-semibold text-slate-800 dark:text-neutral-100
kcSelectAuthListItemDescriptionClass=block text-[11px] text-slate-400 dark:text-neutral-500
kcSelectAuthListItemFillClass=flex-1
kcSelectAuthListItemArrowClass=shrink-0 text-slate-300 dark:text-neutral-600
kcSelectAuthListItemArrowIconClass=ikon-mask ikon-panah-kanan text-lg

# Ikon per jenis authenticator (dibaca base lewat properties[iconCssClass])
kcAuthenticatorOTPClass=ikon-mask ikon-ponsel text-xl
kcAuthenticatorPasswordClass=ikon-mask ikon-kunci text-xl
kcAuthenticatorWebAuthnClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorWebAuthnPasswordlessClass=ikon-mask ikon-sidik-jari text-xl
kcAuthenticatorRecoveryAuthnCodeClass=ikon-mask ikon-daftar-centang text-xl

# ----- WebAuthn -----
kcWebAuthnKeyIcon=ikon-mask ikon-sidik-jari text-xl
# Sengaja DIKOSONGKAN: hanya hiasan kecil di daftar perangkat WebAuthn
# terdaftar, tidak esensial. Mengosongkan lebih aman daripada menambah satu
# data-URI lagi.
kcWebAuthnDefaultIcon=

kcCommonLogoIdP=

# ----- Social providers (fallback; realm ini belum memakainya) -----
kcFormSocialAccountSectionClass=mt-4
kcFormSocialAccountListClass=space-y-2.5
kcFormSocialAccountListGridClass=grid grid-cols-2 gap-2.5
kcFormSocialAccountListButtonClass=w-full inline-flex items-center justify-center gap-2 py-3 rounded-[13px] text-sm font-semibold border-[1.5px] border-slate-200 dark:border-neutral-700 text-slate-600 dark:text-neutral-300 hover:border-merah hover:text-merah transition no-underline
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=truncate

# ----- Pemilih bahasa -----
kcLocaleMainClass=absolute top-2.5 right-3 z-20 text-[11px]
kcLocaleWrapperClass=relative
kcLocaleDropDownClass=relative inline-block
kcLocaleListClass=absolute right-0 mt-1 py-1 bg-white dark:bg-neutral-900 border border-slate-200 dark:border-neutral-700 rounded-xl shadow-lg z-30 hidden
kcLocaleListItemClass=block
kcLocaleItemClass=block px-3.5 py-1.5 text-xs text-slate-600 dark:text-neutral-300 hover:bg-slate-100 dark:hover:bg-neutral-800 no-underline
