# =============================================================================
# Theme: agustusan-2026 — HUT RI ke-81 · SSO ASN Ponorogo (Keycloak 26.7)
# -----------------------------------------------------------------------------
# Theme EVENT kemerdekaan (dipakai sementara di periode Agustus, lalu balik ke
# asn-v2). parent=keycloak supaya semua base form ikut ke-render lewat
# template.ftl custom + di-styling theme.css. Passkey + importmap + authChecker
# di-port dari asn-v2 (sudah terbukti di KC 26.7).
#
# Toggle: set realm loginTheme=agustusan-2026 saat 17-an, balik asn-v2 sesudahnya.
# =============================================================================

parent=keycloak
import=common/keycloak

# CSS event kemerdekaan (custom, bukan Tailwind). Dark mode via prefers-color-scheme.
styles=css/theme.css

locales=id,en

# =============================================================================
# Class mapping → dipakai base form templates via ${properties.*}.
# Nilai memetakan ke class di theme.css.
# =============================================================================

kcHtmlClass=agustusan-html
kcBodyClass=agustusan-body

# Wrapper / card
kcLoginClass=agustusan-login-wrap
kcFormCardClass=kartu
kcFormHeaderClass=hero

# Header realm HTML disembunyikan (branding sudah di hero kita)
kcHeaderClass=hidden
kcHeaderWrapperClass=hidden

kcContentWrapperClass=
kcFormClass=
kcFormGroupClass=field-group
kcFormGroupErrorClass=has-error

# Label & input
kcLabelWrapperClass=
kcLabelClass=label
kcInputWrapperClass=
kcInputGroup=field
kcInputClass=inp
kcInputErrorMessageClass=inp-error
kcTextareaClass=inp

# Buttons
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-2
kcButtonSecondaryClass=btn-passkey
kcButtonBlockClass=btn-block
kcButtonLargeClass=

# Password visibility toggle
kcFormPasswordVisibilityButtonClass=toggle-pw
kcFormPasswordVisibilityIconShow=fa-solid fa-eye
kcFormPasswordVisibilityIconHide=fa-solid fa-eye-slash

# Alerts
kcAlertClass=alert
kcAlertTitleClass=alert-title
kcFeedbackSuccessIcon=fa-solid fa-circle-check
kcFeedbackWarningIcon=fa-solid fa-triangle-exclamation
kcFeedbackErrorIcon=fa-solid fa-circle-exclamation
kcFeedbackInfoIcon=fa-solid fa-circle-info

# Reset-flow icon
kcResetFlowIcon=fa-solid fa-arrow-rotate-left

# Info / sign-up
kcSignUpClass=catatan
kcInfoAreaWrapperClass=

# OTP list (login-otp)
kcLoginOTPListClass=otp-item
kcLoginOTPListInputClass=otp-radio
kcLoginOTPListItemHeaderClass=otp-item-head
kcLoginOTPListItemIconBodyClass=otp-item-icon
kcLoginOTPListItemIconClass=fa-solid fa-mobile-screen-button
kcLoginOTPListItemTitleClass=otp-item-title

# Select authenticator
kcSelectAuthListClass=select-auth
kcSelectAuthListItemClass=select-auth-item
kcSelectAuthListItemIconClass=select-auth-icon
kcSelectAuthListItemBodyClass=select-auth-body
kcSelectAuthListItemHeadingClass=select-auth-title
kcSelectAuthListItemDescriptionClass=select-auth-desc
kcSelectAuthListItemFillClass=
kcSelectAuthListItemArrowIconClass=fa-solid fa-chevron-right

kcAuthenticatorOTPClass=fa-solid fa-mobile-screen-button
kcAuthenticatorPasswordClass=fa-solid fa-key
kcAuthenticatorWebAuthnClass=fa-solid fa-fingerprint
kcAuthenticatorWebAuthnPasswordlessClass=fa-solid fa-fingerprint

# WebAuthn
kcWebAuthnKeyIcon=fa-solid fa-fingerprint
kcWebAuthnDefaultIcon=fa-solid fa-key

kcCommonLogoIdP=

# Social providers (fallback style)
kcFormSocialAccountListClass=social-list
kcFormSocialAccountListButtonClass=btn-2
kcFormSocialAccountNameClass=
