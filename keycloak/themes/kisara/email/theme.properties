# Email theme "kisara" — merek Kisara SSO (sistem logo v1, 2026-11-08).
# parent=keycloak: semua .ftl email (password-reset, email-verification,
# executeActions, event-*) diwarisi; yang di-override hanya html/template.ftl
# (kerangka) + messages_*.properties (teks Bahasa Indonesia).
parent=keycloak
locales=id,en

# Ikon Kisara SSO di kepala email. HARUS alamat yang TIDAK PERNAH berubah:
# alamat sumber daya Keycloak (/resources/<versi>/...) berganti tiap deploy,
# jadi ikon di email lama akan rusak. Kosong = email tanpa ikon (tulisan saja).
# Mengganti logo kelak = unggah dengan NAMA BARU, jangan menimpa yang lama.
kisaraLogoUrl=https://nawasara.ponorogo.go.id/api/v1/asn-portal/public/icons/kisara-sso-email.png
