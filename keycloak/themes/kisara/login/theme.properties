# =============================================================================
# Theme: kisara — login default ekosistem Kisara (sistem logo v1, 2026-11-08)
# -----------------------------------------------------------------------------
# Menggantikan asn-v2 sebagai theme sehari-hari realm asn-productions.
# Mekanik Keycloak 26 di-port dari asn-v2 (importmap rfc4648 untuk passkey,
# authChecker startSessionPolling/checkAuthSession). Halaman yang tidak kita
# tulis ulang ikut ke-render lewat template.ftl + kelas kc* di bawah.
#
# TANPA FontAwesome: setiap ikon yang dirujuk properti di bawah memakai kelas
# ks-icon (SVG Lucide sebagai CSS mask, didefinisikan di input.css). Menambah
# properti ikon baru = menambah kelas ks-icon-* di input.css juga.
#
# Sumber CSS: login/resources/css/input.css → npm run build:kisara.
# JANGAN menulis tangan ke styles.css (pelajaran asn-v2).
# =============================================================================

parent=keycloak
import=common/keycloak

styles=css/styles.css
locales=id,en

kcHtmlClass=h-full
kcBodyClass=min-h-full bg-slate-100 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200

kcLoginClass=mx-auto flex min-h-screen w-full max-w-[440px] flex-col justify-center px-4 py-10
kcHeaderClass=hidden
kcHeaderWrapperClass=hidden
kcFormCardClass=overflow-hidden rounded-[28px] border border-slate-200 bg-white shadow-[0_12px_40px_-16px_rgb(15_23_42/.25)] dark:border-slate-800 dark:bg-slate-900
kcFormHeaderClass=mt-7
kcContentWrapperClass=w-full

kcFormClass=space-y-4
kcFormGroupClass=mb-4
kcFormGroupErrorClass=has-error
kcFormSettingClass=
kcFormOptionsClass=flex flex-col gap-2
kcFormOptionsWrapperClass=text-right text-sm
kcFormButtonsClass=mt-2 flex flex-col gap-3
kcFormButtonsWrapperClass=

kcLabelWrapperClass=mb-1.5
kcLabelClass=mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300
kcInputWrapperClass=
kcInputGroup=relative

kcInputClass=h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-[15px] text-slate-900 placeholder:text-slate-400 focus:border-ks-accent focus:outline-none focus:ring-4 focus:ring-ks-accent/20 aria-[invalid=true]:border-red-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white
kcInputErrorMessageClass=mt-1.5 block text-sm text-red-600 dark:text-red-400
kcTextareaClass=w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-[15px] text-slate-900 focus:border-ks-accent focus:outline-none focus:ring-4 focus:ring-ks-accent/20 dark:border-slate-700 dark:bg-slate-950 dark:text-white

kcButtonClass=inline-flex items-center justify-center gap-2.5 rounded-full text-[15px] font-semibold no-underline transition focus:outline-none focus:ring-4 cursor-pointer
kcButtonPrimaryClass=bg-ks-accent text-white shadow-sm hover:bg-ks-accent-dark focus:ring-ks-accent/30
kcButtonDefaultClass=border border-slate-300 bg-white text-slate-800 hover:bg-slate-50 focus:ring-ks-accent/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800
# Secondary = tombol "Masuk dengan passkey" (#authenticateWebAuthnButton dari
# macro base passkeys.ftl). Ikon sidik jari lewat ks-passkey-btn::before.
kcButtonSecondaryClass=ks-passkey-btn inline-flex h-12 w-full items-center justify-center gap-2.5 rounded-full border border-slate-300 bg-white text-[15px] font-semibold text-slate-800 no-underline transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-ks-accent/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800
kcButtonBlockClass=w-full
kcButtonLargeClass=h-12 px-6
kcMarginTopClass=mt-3

kcFormPasswordVisibilityButtonClass=absolute inset-y-0 right-0 grid w-12 place-items-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white
kcFormPasswordVisibilityIconShow=ks-icon ks-icon-eye
kcFormPasswordVisibilityIconHide=ks-icon ks-icon-eye-off

kcAlertClass=mb-1 mt-5 flex items-start gap-3 rounded-xl border px-4 py-3 text-sm
kcAlertTitleClass=leading-snug

kcFeedbackSuccessIcon=ks-icon ks-icon-check
kcFeedbackWarningIcon=ks-icon ks-icon-warning
kcFeedbackErrorIcon=ks-icon ks-icon-alert
kcFeedbackInfoIcon=ks-icon ks-icon-info
kcResetFlowIcon=ks-icon ks-icon-rotate

kcSignUpClass=mt-6 text-center text-sm text-slate-600 dark:text-slate-300
kcInfoAreaWrapperClass=

# OTP credential list (login-otp / login-reset-otp)
kcLoginOTPListClass=ks-otp-item flex cursor-pointer items-center gap-3 rounded-xl border border-slate-300 p-3 hover:border-ks-accent dark:border-slate-700
kcLoginOTPListInputClass=ks-otp-radio
kcLoginOTPListItemHeaderClass=flex items-center gap-3
kcLoginOTPListItemIconBodyClass=grid h-9 w-9 place-items-center rounded-full bg-ks-accent-soft text-ks-accent dark:bg-teal-900/40 dark:text-teal-300
kcLoginOTPListItemIconClass=ks-icon ks-icon-phone
kcLoginOTPListItemTitleClass=text-sm font-medium text-slate-800 dark:text-slate-100

# Select authenticator
kcSelectAuthListClass=space-y-3
kcSelectAuthListItemClass=flex w-full cursor-pointer items-center gap-4 rounded-2xl border border-slate-300 bg-white p-4 text-left transition hover:border-ks-accent dark:border-slate-700 dark:bg-slate-900
kcSelectAuthListItemIconClass=grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-ks-accent-soft text-ks-accent dark:bg-teal-900/40 dark:text-teal-300
kcSelectAuthListItemIconPropertyClass=
kcSelectAuthListItemBodyClass=min-w-0 flex-1
kcSelectAuthListItemHeadingClass=text-sm font-semibold text-slate-800 dark:text-slate-100
kcSelectAuthListItemDescriptionClass=text-xs text-slate-500 dark:text-slate-400
kcSelectAuthListItemFillClass=flex-1
kcSelectAuthListItemArrowClass=text-slate-400
kcSelectAuthListItemArrowIconClass=ks-icon ks-icon-chevron

kcAuthenticatorOTPClass=ks-icon ks-icon-phone
kcAuthenticatorPasswordClass=ks-icon ks-icon-key
kcAuthenticatorWebAuthnClass=ks-icon ks-icon-fingerprint
kcAuthenticatorWebAuthnPasswordlessClass=ks-icon ks-icon-fingerprint
kcAuthenticatorRecoveryAuthnCodeClass=ks-icon ks-icon-lifebuoy
kcWebAuthnKeyIcon=ks-icon ks-icon-fingerprint
kcWebAuthnDefaultIcon=ks-icon ks-icon-key
kcCommonLogoIdP=

kcFormSocialAccountSectionClass=mt-6
kcFormSocialAccountListClass=space-y-2
kcFormSocialAccountListGridClass=grid grid-cols-2 gap-2
kcFormSocialAccountListButtonClass=inline-flex h-11 w-full items-center justify-center gap-2 rounded-full border border-slate-300 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=truncate
