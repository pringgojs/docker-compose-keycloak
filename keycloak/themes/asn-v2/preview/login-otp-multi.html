<!DOCTYPE html>
<html class="h-full" lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifikasi OTP — preview asn-v2</title>
    <link href="../login/resources/css/styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet" />
    <style>body{font-family:"Inter",sans-serif}</style>
  </head>
  <body class="asn-body min-h-screen bg-gray-300 dark:bg-gray-900 flex items-center justify-center p-2">
    <button onclick="document.documentElement.classList.toggle('dark')"
      class="fixed top-3 right-3 z-50 px-3 py-1.5 text-xs rounded-lg bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 shadow">
      <i class="fa-solid fa-circle-half-stroke"></i> Toggle dark
    </button>
    <div class="w-full flex items-center justify-center">
      <div class="asn-card relative z-10 w-full max-w-md bg-white dark:bg-gray-800/90 shadow-2xl rounded-2xl overflow-hidden">
        <div class="asn-brand bg-white dark:bg-gradient-to-r dark:from-gray-800 dark:via-gray-700 dark:to-gray-600 px-6 pt-5 pb-4 flex items-center gap-3 border-b border-gray-100 dark:border-gray-700">
          <img src="../login/resources/img/logo_warna.png" alt="Logo" class="block dark:hidden w-auto h-14" />
          <img src="../login/resources/img/logo_hitam-putih.png" alt="Logo" class="hidden dark:block w-auto h-14" />
          <div class="leading-tight">
            <h1 class="text-lg font-bold text-gray-800 dark:text-gray-100">Single Sign-On ASN</h1>
            <p class="text-xs text-gray-500 dark:text-gray-300">Kabupaten Ponorogo</p>
          </div>
        </div>
        <header class="asn-card-header px-8 pt-6 pb-2 text-center">
          <h1 class="text-xl font-bold text-gray-800 dark:text-gray-100">Verifikasi OTP</h1>
          
          
        </header>
        <div class="px-8 pb-6 pt-2">
          <div><form class="space-y-4">
      <label class="asn-otp-item flex items-center gap-3 p-3 mb-2 rounded-lg border border-gray-300 dark:border-gray-700 cursor-pointer hover:border-red-500 dark:hover:border-red-500"><input type="radio" name="cred" class="accent-red-600" checked />
        <span class="flex items-center justify-center w-9 h-9 rounded-full bg-red-50 dark:bg-red-900/40 text-red-600 dark:text-red-300"><i class="fa-solid fa-mobile-screen-button"></i></span>
        <span class="text-sm font-medium text-gray-800 dark:text-gray-100">HP Kantor</span></label>
      <label class="asn-otp-item flex items-center gap-3 p-3 mb-2 rounded-lg border border-gray-300 dark:border-gray-700 cursor-pointer hover:border-red-500 dark:hover:border-red-500"><input type="radio" name="cred" class="accent-red-600" />
        <span class="flex items-center justify-center w-9 h-9 rounded-full bg-red-50 dark:bg-red-900/40 text-red-600 dark:text-red-300"><i class="fa-solid fa-mobile-screen-button"></i></span>
        <span class="text-sm font-medium text-gray-800 dark:text-gray-100">HP Pribadi</span></label>
      <div class="mb-4"><label class="block text-sm font-medium text-gray-700 dark:text-gray-200 text-center">Kode OTP</label><input type="hidden" id="otp" name="otp" />
    <div class="asn-otp mt-2" data-otp-target="otp" data-otp-autofocus><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" /><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2" /><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3" /><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4" /><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5" /><input class="asn-otp-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6" /></div></div>
      <button type="button" class="asn-btn inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition duration-200 cursor-pointer bg-red-600 dark:bg-red-800 text-white hover:bg-red-700 dark:hover:bg-red-700 w-full py-2 px-4 text-sm">Verifikasi</button>
    </form></div>
        </div>
        <div class="asn-footer">
          <div class="bg-[#bd4137] dark:bg-gray-600 h-1 w-full">&nbsp;</div>
          <div class="px-6 py-3 text-center">
            <p class="text-[11px] leading-tight text-gray-500 dark:text-gray-400">© 2025 Pemerintah Kabupaten Ponorogo<br />Dinas Komunikasi Informatika dan Statistik</p>
          </div>
        </div>
      </div>
    </div>
    <script src="../login/resources/js/otp-input.js"></script>
  </body>
</html>
