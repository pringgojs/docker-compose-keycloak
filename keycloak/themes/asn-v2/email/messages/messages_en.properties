# messages_en.properties — sengaja diisi Bahasa Indonesia.
# Audiens semua ASN Indonesia. Locale email/login sering resolve ke 'en',
# dan messages_en theme ini menang atas messages_en parent (English).
# Isi identik dengan messages_id.properties.
#
# =============================================================================
# Email messages — Bahasa Indonesia, theme asn-v2.
# Placeholder {0},{1},... WAJIB dipertahankan persis (Keycloak mengisi link,
# email, nama realm, masa berlaku, dst.). Tanda kutip tunggal harus '' (dobel)
# karena MessageFormat. Encoding ASCII + \uXXXX (standar .properties).
# =============================================================================

# ---- Verifikasi Email ----
emailVerificationSubject=Verifikasi Email Akun SSO ASN Ponorogo
emailVerificationBody=Sebuah akun {2} telah dibuat dengan alamat email ini. Jika ini Anda, klik tautan di bawah untuk memverifikasi alamat email Anda.\n\n{0}\n\nTautan ini akan kedaluwarsa dalam {3}.\n\nJika Anda tidak membuat akun ini, abaikan saja email ini.
emailVerificationBodyHtml=<p>Sebuah akun <b>{2}</b> telah dibuat dengan alamat email ini. Jika ini Anda, klik tombol di bawah untuk memverifikasi alamat email Anda.</p><p style="margin:24px 0;"><a href="{0}" style="background-color:#bd4137; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; display:inline-block;">Verifikasi Email</a></p><p style="font-size:13px; color:#6b7280;">Atau salin tautan ini ke browser Anda:<br /><a href="{0}" style="color:#bd4137; word-break:break-all;">{0}</a></p><p>Tautan ini akan kedaluwarsa dalam <b>{3}</b>.</p><p style="font-size:13px; color:#9ca3af;">Jika Anda tidak membuat akun ini, abaikan saja email ini.</p>

# ---- Reset Password ----
passwordResetSubject=Reset Password Akun SSO ASN Ponorogo
passwordResetBody=Seseorang meminta perubahan kredensial akun {2} Anda. Jika ini Anda, klik tautan di bawah untuk mengatur ulang.\n\n{0}\n\nTautan ini akan kedaluwarsa dalam {3}.\n\nJika Anda tidak meminta reset, abaikan saja email ini dan tidak ada yang berubah.
passwordResetBodyHtml=<p>Seseorang meminta perubahan kredensial akun <b>{2}</b> Anda. Jika ini Anda, klik tombol di bawah untuk mengatur ulang password.</p><p style="margin:24px 0;"><a href="{0}" style="background-color:#bd4137; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; display:inline-block;">Reset Password</a></p><p style="font-size:13px; color:#6b7280;">Atau salin tautan ini ke browser Anda:<br /><a href="{0}" style="color:#bd4137; word-break:break-all;">{0}</a></p><p>Tautan ini akan kedaluwarsa dalam <b>{3}</b>.</p><p style="font-size:13px; color:#9ca3af;">Jika Anda tidak meminta reset, abaikan saja email ini dan tidak ada yang berubah.</p>

# ---- Update Akun (execute actions — mis. Aktivasi OTP, reset OTP) ----
executeActionsSubject=Pembaruan Akun SSO ASN Ponorogo
executeActionsBody=Administrator meminta Anda memperbarui akun {2} dengan melakukan tindakan berikut: {3}. Klik tautan di bawah untuk memulai proses.\n\n{0}\n\nTautan ini akan kedaluwarsa dalam {4}.\n\nJika Anda tidak mengetahui permintaan ini, abaikan saja email ini dan tidak ada yang berubah.
executeActionsBodyHtml=<p>Administrator meminta Anda memperbarui akun <b>{2}</b> dengan melakukan tindakan berikut: <b>{3}</b>. Klik tombol di bawah untuk memulai proses.</p><p style="margin:24px 0;"><a href="{0}" style="background-color:#bd4137; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; display:inline-block;">Lanjutkan Pembaruan Akun</a></p><p style="font-size:13px; color:#6b7280;">Atau salin tautan ini ke browser Anda:<br /><a href="{0}" style="color:#bd4137; word-break:break-all;">{0}</a></p><p>Tautan ini akan kedaluwarsa dalam <b>{4}</b>.</p><p style="font-size:13px; color:#9ca3af;">Jika Anda tidak mengetahui permintaan ini, abaikan saja email ini dan tidak ada yang berubah.</p>

# ---- Konfirmasi update email ----
emailUpdateConfirmationSubject=Verifikasi Email Baru — SSO ASN Ponorogo
emailUpdateConfirmationBody=Untuk memperbarui akun {2} dengan alamat email {1}, klik tautan di bawah.\n\n{0}\n\nTautan ini akan kedaluwarsa dalam {3}.\n\nJika Anda tidak ingin melanjutkan perubahan ini, abaikan saja email ini.
emailUpdateConfirmationBodyHtml=<p>Untuk memperbarui akun <b>{2}</b> dengan alamat email <b>{1}</b>, klik tombol di bawah.</p><p style="margin:24px 0;"><a href="{0}" style="background-color:#bd4137; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; display:inline-block;">Verifikasi Email Baru</a></p><p>Tautan ini akan kedaluwarsa dalam <b>{3}</b>.</p><p style="font-size:13px; color:#9ca3af;">Jika Anda tidak ingin melanjutkan perubahan ini, abaikan saja email ini.</p>

