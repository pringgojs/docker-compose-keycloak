# =============================================================================
# Theme: asn-v2  (Keycloak 24.0.3 login theme — Pemkab Ponorogo / KORPRI)
# -----------------------------------------------------------------------------
# Strategi: extend "keycloak" parent supaya SEMUA form login (login-otp,
# login-reset-password, login-reset-otp, recovery-codes, update-profile,
# verify-email, select-authenticator, terms, page-expired, code, dst.) ikut
# ke-render lewat template.ftl custom kita TANPA harus nulis ulang tiap page.
#
# Chrome (logo, particles, dark mode, footer) ada di template.ftl.
# Styling field/tombol/alert base form di-drive lewat properties kc*Class di
# bawah ini — di-map ke utility Tailwind. Jadi page yang TIDAK kita override
# pun tetap tampil rapi (ini yang sebelumnya rusak di theme "asn").
# =============================================================================

parent=keycloak
import=common/keycloak

# CSS hasil build Tailwind (lihat README + tailwind.config.js)
styles=css/styles.css

# Background particles (sama seperti theme asn)
scripts=js/particles.min.js

# ----- Locale -----
locales=id,en

# =============================================================================
# Class mapping → Tailwind. Dipakai oleh base form templates via ${properties.*}
# =============================================================================

kcHtmlClass=h-full
kcBodyClass=asn-body min-h-screen bg-gray-300 dark:bg-gray-900 flex items-center justify-center p-2

# Wrapper terluar (kc-login)
kcLoginClass=w-full flex items-center justify-center

# Header (judul HTML realm) — kita sembunyikan, branding sudah di card kita
kcHeaderClass=hidden
kcHeaderWrapperClass=hidden

# Kartu form utama
kcFormCardClass=asn-card relative z-10 w-full max-w-md bg-white dark:bg-gray-800/90 shadow-2xl rounded-2xl overflow-hidden
kcFormHeaderClass=asn-card-header px-8 pt-6 pb-2 text-center

# Konten
kcContentWrapperClass=w-full

# Grup form
kcFormClass=space-y-4
kcFormGroupClass=asn-form-group mb-4
kcFormGroupErrorClass=has-error
kcFormSettingClass=asn-form-setting
kcFormOptionsClass=flex flex-col gap-2
kcFormOptionsWrapperClass=text-right
kcFormButtonsClass=mt-2
kcFormButtonsWrapperClass=

# Label & wrapper
kcLabelWrapperClass=mb-1
kcLabelClass=block text-sm font-medium text-gray-700 dark:text-gray-200
kcInputWrapperClass=asn-input-wrapper
kcInputGroup=asn-input-group relative flex items-stretch

# Input field
kcInputClass=asn-input mt-1 w-full px-4 py-2 text-sm border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 placeholder-gray-400
kcInputErrorMessageClass=asn-input-error mt-1 block text-xs font-medium text-red-600 dark:text-red-400
kcTextareaClass=asn-input mt-1 w-full px-4 py-2 text-sm border rounded-lg shadow-sm border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100

# Tombol
kcButtonClass=asn-btn inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition duration-200 cursor-pointer
kcButtonPrimaryClass=asn-btn-primary bg-red-600 dark:bg-red-800 text-white hover:bg-red-700 dark:hover:bg-red-700
kcButtonDefaultClass=asn-btn-default bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600
# Secondary dipakai tombol "Login dengan Passkey" (authenticateWebAuthnButton).
# Outline merah + py biar konsisten dgn tombol Masuk tapi terbaca sebagai aksi
# alternatif. asn-passkey-btn diberi ikon fingerprint via CSS ::before.
kcButtonSecondaryClass=asn-btn asn-passkey-btn py-2 px-4 text-sm border border-red-600 dark:border-red-500 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 no-underline
kcButtonBlockClass=w-full
kcButtonLargeClass=py-2 px-4 text-sm
kcMarginTopClass=mt-3

# Password visibility toggle
kcFormPasswordVisibilityButtonClass=asn-pw-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200
kcFormPasswordVisibilityIconShow=fa-solid fa-eye
kcFormPasswordVisibilityIconHide=fa-solid fa-eye-slash

# Alert (success / warning / error / info)
kcAlertClass=asn-alert flex items-start gap-3 rounded-lg p-3 mb-4 text-sm border
kcAlertTitleClass=asn-alert-title leading-snug

# Feedback icons (FontAwesome — di-load di template.ftl)
kcFeedbackSuccessIcon=fa-solid fa-circle-check
kcFeedbackWarningIcon=fa-solid fa-triangle-exclamation
kcFeedbackErrorIcon=fa-solid fa-circle-exclamation
kcFeedbackInfoIcon=fa-solid fa-circle-info

# Reset-flow icon (tooltip "restart login")
kcResetFlowIcon=fa-solid fa-arrow-rotate-left

# Info / sign-up area
kcSignUpClass=asn-info mt-4 text-center text-sm text-gray-600 dark:text-gray-300
kcInfoAreaWrapperClass=

# ----- OTP credential list (login-otp / login-reset-otp) -----
kcLoginOTPListClass=asn-otp-item flex items-center gap-3 p-3 mb-2 rounded-lg border border-gray-300 dark:border-gray-700 cursor-pointer hover:border-red-500 dark:hover:border-red-500
kcLoginOTPListInputClass=asn-otp-radio mr-2 accent-red-600
kcLoginOTPListItemHeaderClass=flex items-center gap-3
kcLoginOTPListItemIconBodyClass=flex items-center justify-center w-9 h-9 rounded-full bg-red-50 dark:bg-red-900/40 text-red-600 dark:text-red-300
kcLoginOTPListItemIconClass=fa-solid fa-mobile-screen-button
kcLoginOTPListItemTitleClass=text-sm font-medium text-gray-800 dark:text-gray-100

# ----- Select authenticator (select-authenticator.ftl) -----
kcSelectAuthListClass=asn-select-auth space-y-3
kcSelectAuthListItemClass=asn-select-auth-item w-full flex items-center gap-4 p-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 hover:border-red-500 dark:hover:border-red-500 transition cursor-pointer text-left
kcSelectAuthListItemIconClass=flex items-center justify-center w-10 h-10 rounded-lg bg-red-50 dark:bg-red-900/40 text-red-600 dark:text-red-300 shrink-0
kcSelectAuthListItemIconPropertyClass=text-lg
kcSelectAuthListItemBodyClass=flex-1 min-w-0
kcSelectAuthListItemHeadingClass=text-sm font-semibold text-gray-800 dark:text-gray-100
kcSelectAuthListItemDescriptionClass=text-xs text-gray-500 dark:text-gray-400
kcSelectAuthListItemFillClass=flex-1
kcSelectAuthListItemArrowClass=text-gray-400 dark:text-gray-500
kcSelectAuthListItemArrowIconClass=fa-solid fa-chevron-right

# Auth selection icon classes (di-referensikan select-authenticator via properties[iconCssClass])
kcAuthenticatorOTPClass=fa-solid fa-mobile-screen-button
kcAuthenticatorPasswordClass=fa-solid fa-key
kcAuthenticatorWebAuthnClass=fa-solid fa-fingerprint
kcAuthenticatorWebAuthnPasswordlessClass=fa-solid fa-fingerprint
kcAuthenticatorRecoveryAuthnCodeClass=fa-solid fa-life-ring

# ----- WebAuthn -----
kcWebAuthnKeyIcon=fa-solid fa-fingerprint
kcWebAuthnDefaultIcon=fa-solid fa-key

# Common logo for IdP
kcCommonLogoIdP=

# Social providers
kcFormSocialAccountSectionClass=asn-social mt-4
kcFormSocialAccountListClass=space-y-2
kcFormSocialAccountListGridClass=grid grid-cols-2 gap-2
kcFormSocialAccountListButtonClass=asn-btn w-full inline-flex items-center justify-center gap-2 py-2 px-4 rounded-xl border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-sm text-gray-700 dark:text-gray-200
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=truncate

# Locale dropdown
kcLocaleMainClass=asn-locale absolute top-3 right-3 text-xs
kcLocaleWrapperClass=relative
kcLocaleDropDownClass=relative inline-block
kcLocaleListClass=absolute right-0 mt-1 py-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-20 hidden
kcLocaleListItemClass=block
kcLocaleItemClass=block px-3 py-1 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700
